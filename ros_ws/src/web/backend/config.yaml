# MAX_NAV_ROBOT 后端配置（可用环境变量 ROBOT_UI_CONFIG 指向另一份，比如仿真）
port: 8000
ros_domain_id: 0
ros2_setup: "/opt/ros/humble/setup.bash"
workspace_setup: "~/max_robot/ros_ws/install/setup.bash"
log_buffer_size: 2000

# 登录。网页、REST、rosbridge（经后端 /ros 代理）都要登录后才能用
auth:
  username: "max_robot"
  password: "max_robot"        # 部署前改掉
  session_hours: 72

# 地图搜索目录：递归查找含 image: 字段的 .yaml（最多 3 层）。新建的地图保存到第一个目录
map_dirs:
  - "~/max_robot/maps"
  - "~/max_robot/ros_ws/src/robot_nav/maps"

# 运行时状态（默认地图、各地图的初始位姿），网页上改了会写回这里
state_file: "~/max_robot/robot_ui_state.json"

# 每张地图的绘图标注和命名点位（web 和 ROS points_server 共用）
annotations_dir: "~/max_robot/annotations"

# 网页相机「拍照」存的照片（camera_node 写入，要和 camera.yaml 的 capture_dir 一致）
captures_dir: "~/max_robot/captures"

# 后端启动时自动拉起的进程；若 state_file 里设置了默认地图，base 起来后会直接进导航
#   points: 点位 ROS 服务 /points/*（依赖 robot_interfaces 已编译）
#   camera: 前置相机（person_locator 已编译）
autostart: [rosbridge, base, points, camera]

# 各进程的启动命令（bash 执行，已 source ROS 环境）
#   rosbridge: 只监听本机，外部经后端 /ros 代理（带登录校验）访问
#   base:  底盘 + 雷达 + lio + ekf + 静态TF（不含 slam_toolbox）
#   slam:  slam_toolbox 建图，叠在 base 上
#   nav:   map_server + 定位 + nav2，叠在 base 上；{map} 替换为地图 yaml 绝对路径
#   camera: USB 相机，发 /camera/image_raw/compressed、/camera/preview/compressed、/camera/camera_info
#   calib:  棋盘格在线标定，网页相机窗口里操作，结果写 ~/max_robot/calib/camera_info.yaml
#   person: 人员跟踪 + /person/approach（走到人面前），要 camera 和导航在跑；网页「人员跟随」里调试
processes:
  rosbridge: "ros2 launch rosbridge_server rosbridge_websocket_launch.xml address:=127.0.0.1 port:=9090"
  base: "ros2 launch robot_nav robot.launch.py slam:=false"
  slam: >-
    ros2 run slam_toolbox async_slam_toolbox_node --ros-args
    --params-file $(ros2 pkg prefix robot_nav)/share/robot_nav/config/slam_toolbox.yaml
    -p use_sim_time:=false
  nav: "ros2 launch robot_nav nav2.launch.py use_sim_time:=false launch_rviz:=false map:={map}"
  points: "python3 {web}/ros_nodes/points_server.py"
  camera: >-
    ros2 run person_locator camera_node --ros-args
    --params-file $(ros2 pkg prefix person_locator)/share/person_locator/config/camera.yaml
  calib: >-
    ros2 run person_locator calib_node --ros-args
    --params-file $(ros2 pkg prefix person_locator)/share/person_locator/config/camera.yaml
  person: >-
    ros2 run person_locator person_tracker --ros-args
    --params-file $(ros2 pkg prefix person_locator)/share/person_locator/config/person_tracker.yaml

# 后端代理的 rosbridge 地址
rosbridge_url: "ws://127.0.0.1:9090"

# 自检用的设备（by-id，不随插拔顺序变化）
serial_devices:
  bridge: "/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0"
  lidar: "/dev/serial/by-id/usb-Silicon_Labs_CP2102N_USB_to_UART_Bridge_Controller_bc333ee39c31f1119715925f30d20014-if00-port0"
  camera: "/dev/v4l/by-id/usb-AX_USB2.0_AX_USB2.0-video-index0"
