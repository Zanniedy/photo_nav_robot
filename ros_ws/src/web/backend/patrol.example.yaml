# 巡逻路线参数文件示例：拷到 ~/max_robot/patrol.yaml 再改（每台机器人一份，不进仓库）
# 后端启动、每次起导航 / 切地图时读这个文件，把路线写进那张地图（同名路线以这里为准），只生成路线，不自动开始巡逻
# 点位用网页地图上标好的点名（控制页「点位」），顺序就是巡逻顺序，可以重复
# 开始巡逻：POST /api/v1/tasks {"type": "patrol", "route": "<路线名>"}
maps:
  map_20261022_181620:          # 地图名 = maps 目录里 yaml 的文件名（不带 .yaml）
    routes:
      - name: 大厅一圈
        loop: true              # 走完从头再来；false = 走一遍就结束
        points: [门口, 前台, 会议室, 前台]
