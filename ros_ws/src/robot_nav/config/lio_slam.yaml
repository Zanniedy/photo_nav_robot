lio_slam_node:
  ros__parameters:
    scan_topic:   /scan
    pub_topic:    /lio_odom
    yaw_topic:    /robot/yaw
    odom_frame:   lio_odom
    base_frame:   base_footprint
    publish_tf:   false
    buf_max:      200
    loop_rate_hz: 10.0
    # 门限 = ICP 结果相对预测(上一位姿 + IMU yaw 增量)的偏差，不是帧间运动量
    max_trans:    0.10   # m
    max_rot:      0.08   # rad (~4.6°)，IMU 短时间内很准，偏差大说明 ICP 退化/误匹配
    kf_trans:     0.30   # 相对关键帧平移超过此值换关键帧 (m)
    kf_rot:       0.35   # 相对关键帧旋转超过此值换关键帧 (rad)
    max_rejects:  10     # 连续拒绝超过此数强制重置关键帧
    # 高速补偿（2026-10-22）
    deskew:          true    # 扫描运动补偿
    deskew_reversed: true    # scan 下标大的点先采；装反了的表现是原地转时墙更糊，切 false 对比
    pred_min_speed:  0.05    # m/s，低于此不外推平移
    # 动态点过滤（2026-10-26）：和 ~0.3s 前的帧比，移动快于 dyn_speed 的点（走动的人）不参与 ICP
    dyn_enable:    true
    dyn_speed:     0.5     # m/s
    dyn_margin:    0.06    # m
    dyn_ref_dt:    0.3     # s
    dyn_max_ratio: 0.3     # 动态点超过这个比例说明运动预测错了，本帧不过滤
